<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opencast Meet</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/consent.js" defer></script>
</head>
<body>
  <div class="card">
    <img class="logo" src="/static/img/logo.png" alt="Opencast">
    <h1>Join Meeting</h1>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST" action="/join">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" placeholder="Jane Smith" value="{{.Name}}" maxlength="100" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
      {{if gt (len .Rooms) 1}}
      <label for="room">Meeting Room</label>
      <select id="room" name="room">
        {{range .Rooms}}<option value="{{.ID}}" data-record="{{.Record}}"{{if eq .ID $.SelectedRoom}} selected{{end}}>{{.Name}}{{if .Record}} (rec){{end}}</option>
        {{end}}
      </select>
      {{end}}
      {{if or .SelectedRoomRecordable (gt (len .Rooms) 1)}}
      <div id="consent-wrap" class="consent-wrap"{{if not .SelectedRoomRecordable}} hidden{{end}}>
        <label class="consent-label">
          <input type="checkbox" name="recording_consent" id="recording_consent"{{if .SelectedRoomRecordable}} required{{end}}>
          This room may be recorded. By entering, you consent to the recording of your voice and image.
        </label>
      </div>
      {{end}}
      <button type="submit">Join</button>
    </form>
  </div>
</body>
</html>
